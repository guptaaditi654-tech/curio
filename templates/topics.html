<!DOCTYPE html>
<html>

<head>
    <title>Curio - Topics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>🧠 CURIO</h1>

    <h2>{{ level }} Topics</h2>

    <p>Choose a topic to explore.</p>

    <hr>

    {% for topic in topics %}

        <h3>
            <a href="/topic/{{ topic[0] }}?level={{ level }}">
                {{ topic[0] }}. {{ topic[1] }}
            </a>
        </h3>

        <p><b>Category:</b> {{ topic[2] }}</p>

        <p>{{ topic[3] }}</p>

        <hr>

    {% endfor %}

    <br>

    <a href="/">
        <button>← Back to Home</button>
    </a>

</body>

</html>
